name: Council mock poller

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: hive-council-mock-poller
  cancel-in-progress: false

jobs:
  mock-poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Mock GPT transport (no model calls)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 council_poll.py --repo BillyMixNix/hive-council --agent gpt --issue 2 --post
      - name: Mock Gemini transport (no model calls)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 council_poll.py --repo BillyMixNix/hive-council --agent gemini --issue 2 --post
